<div
  class="photo-card"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
  [style.transform]="dragTransform()"
  [class.dragging]="dragging()"
>
  <div class="photo-area">
    @if (imageUrl) {
      <img class="photo-img" [src]="imageUrl" alt="" draggable="false" />
    }
  </div>
  <div class="swipe-overlay overlay-keep" [style.opacity]="dragX() > 0 ? dragX() / 100 : 0">
    KEEP →
  </div>
  <div class="swipe-overlay overlay-reject" [style.opacity]="dragX() < 0 ? -dragX() / 100 : 0">
    ← REJECT
  </div>
  <div class="swipe-overlay overlay-edit" [style.opacity]="dragY() < 0 ? -dragY() / 100 : 0">
    ↑ EDIT
  </div>
  <div class="swipe-overlay overlay-maybe" [style.opacity]="dragY() > 0 ? dragY() / 100 : 0">
    ↓ MAYBE
  </div>
  <div class="photo-top">
    <span class="chip">{{ photo.album || 'No album' }}</span>
  </div>
  <div class="photo-bottom">
    <div>
      <div class="photo-name">{{ photo.name }}.RAW</div>
      <div class="photo-meta">{{ photo.taken }}</div>
    </div>
    @if (photo.starred) {
      <span class="photo-star">★ 5</span>
    }
  </div>
</div>
