@if (nav.groupPicking(); as kind) {
  <!-- Replaces the card, as it does on a pano: the same strip, asked the question that fits. -->
  <app-pano-frame-picker
    [seed]="seed()"
    [kind]="kind"
    (confirmed)="applyFrames($event)"
    (cancelled)="nav.closeGroupPicker()"
  />
} @else {
  <app-photo-card
    [photo]="photo()"
    [imageUrl]="imageUrl"
    [imageUrls]="imageUrls"
    (swiped)="swiped.emit($event)"
    (tapped)="tapped.emit()"
    (compare)="compare.emit($event)"
  />
  <!-- Coloured by what each button means, not by where it stands. They used to be picked out by
       :nth-child, so reordering them or slipping one in between recoloured the rest — the ✓ turning
       red while the ✕ turned green, each still doing the right thing and saying the wrong one. -->
  <div class="action-buttons">
    @for (button of quickVerdicts; track button.verdict) {
      <button
        [class.primary]="button.primary"
        [style.color]="verdictStyle[button.verdict].colour"
        [attr.aria-label]="verdictStyle[button.verdict].label"
        (click)="swiped.emit(button.verdict)"
      >
        {{ verdictStyle[button.verdict].glyph }}
      </button>
    }
    <button class="star" (click)="starToggle.emit()">{{ photo().starred ? '★' : '☆' }}</button>
  </div>
  @if (photo().ai; as hint) {
    <div class="ai-hint">
      <span class="chip chip-dim">AI leans {{ hint.verdict }} · {{ hint.reason }}</span>
    </div>
  }
}
