@if (prefs.stereoEnabled() && album()) {
  <div class="review-tags">
    <button
      class="stereo-pill"
      [class.on]="isStereo()"
      title="Tap to cycle: both eyes → left eyes → right eyes → off"
      (click)="cycleStereo()"
    >
      <span class="pill-dot"></span>{{ label() }}
    </button>
  </div>
}
