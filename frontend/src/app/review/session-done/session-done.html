<div class="session-done">
  <h2>All caught up.</h2>
  <p>{{ keptCount }} kept</p>
  <p>{{ rejectedCount }} rejected</p>
  <p>{{ toEditCount }} flagged to edit</p>
  <p>{{ maybeCount }} in doubt</p>
  @if (canLoadMore) {
    <button (click)="loadMore.emit()">Review more</button>
  }
  <button class="secondary" (click)="printsClick.emit()">Go to Prints →</button>
</div>
