<div class="pano-card">
  <div class="pano-strip" [class.vertical]="pano.orientation === 'vertical'">
    @for (frame of pano.frames; track frame.id) {
      <div class="pano-frame" [class.blur]="frame.blur">
        @if (imageUrls.get(frame.id); as url) {
          <img class="pano-frame-img" [src]="url" alt="" draggable="false" />
        } @else {
          <div class="frame-name">{{ frame.name }}</div>
        }
      </div>
    }
  </div>
  <div class="pano-info">
    <div>
      <div class="pano-name">{{ pano.name }}</div>
      <div class="pano-meta">
        {{ pano.frames.length }} frames · {{ pano.orientation }} sweep · ~30% overlap
      </div>
    </div>
    <span class="chip chip-amber">panorama</span>
  </div>
  <div class="action-buttons">
    <button (click)="swiped.emit('rejected')">✕</button>
    <button (click)="swiped.emit('toEdit')">↑</button>
    <button (click)="swiped.emit('kept')">✓</button>
    <button (click)="swiped.emit('maybe')">↓</button>
  </div>
  <button class="reclassify" (click)="reclassified.emit()">actually a burst →</button>
</div>
