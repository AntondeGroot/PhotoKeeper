<div class="burst-card">
  <div>
    <p class="burst-heading">Which is better — A or B?</p>
    <p class="burst-subtitle">
      Burst of {{ burst.photos.length }}. Soft frames are excluded automatically; the rest duel one
      pair at a time. Tap the winner.
    </p>
  </div>
  <div class="burst-frames">
    @for (photo of survivors; track photo.id; let i = $index) {
      <button class="burst-frame" (click)="picked.emit(photo.id)">
        @if (imageUrls.get(photo.id); as url) {
          <img class="burst-frame-img" [src]="url" alt="" draggable="false" />
        }
        <div class="frame-label">{{ i === 0 ? 'A' : 'B' }}</div>
        <div class="frame-name">{{ photo.name }}</div>
      </button>
    }
  </div>
  <div class="burst-footer">
    <button class="zoom-btn" [class.active]="zoomed()" (click)="toggleZoom()">
      {{ zoomed() ? 'Zoomed — same spot on both' : 'Zoom detail' }}
    </button>
    @if (excluded.length > 0) {
      <span class="excluded-chip">{{ excluded.length }} soft frame excluded</span>
    }
  </div>
  <button class="reject-all" (click)="rejectedAll.emit()">neither — reject the burst</button>
</div>
