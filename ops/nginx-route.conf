# PhotoKeeper's route on the Pi, installed by deploy.sh as /etc/nginx/app-routes/photokeeper.conf.
#
# Included inside GameRoom's server block (GWT_GameRoom/nginx.conf), which serves antondegroot.uk.
# It is a file of its own rather than a block in GameRoom's file because GameRoom's setup-pi.sh
# copies that file over the Pi's — which once wiped this route and took PhotoKeeper offline.
#
# photokeeper_backend is the blue/green upstream deploy.sh re-aims on each release
# (/etc/nginx/conf.d/photokeeper-upstream.conf). The prefix is kept, not stripped: the app runs
# with context path /photokeeper.
location /photokeeper/ {
    proxy_pass http://photokeeper_backend/photokeeper/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cloudflare Tunnel reaches nginx over plain HTTP; pass on the scheme Cloudflare saw.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
