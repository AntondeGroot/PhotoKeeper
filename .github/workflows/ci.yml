name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test -- --watch=false --coverage
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  # ── Backend ─────────────────────────────────────────────────────────────────

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Publish test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  # ── Android ─────────────────────────────────────────────────────────────────

  # The build scripts/install-android.sh runs, minus the phone. Nothing else in CI touches Gradle, so
  # a dependency update could break the install with every check green: an Android Gradle Plugin update
  # did. Renovate automerges on these checks, which is why this has to be one of them.
  android-build:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      # Install, not ci: the root package-lock.json is gitignored, so there is no lockfile to install from.
      - run: npm install
      - run: npm ci
        working-directory: frontend
      - run: npm run cap:sync

      # Generated by the sync but committed, and Gradle builds happily from a stale copy: a plugin
      # missing from these is simply left out of the APK, and only fails on a phone.
      - name: Fail if the committed Capacitor files are out of date
        run: git diff --exit-code -- android/capacitor.settings.gradle android/app/capacitor.build.gradle

      - run: ./gradlew assembleDebug --console=plain
        working-directory: android

  # ── E2E ─────────────────────────────────────────────────────────────────────

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # TODO: add Playwright or Cypress once an E2E framework is set up
    steps:
      - uses: actions/checkout@v7
      - run: echo "No E2E tests yet"
  # ── Gate ────────────────────────────────────────────────────────────────────

  # The one check the `main` ruleset requires, matched by its name `ci`: rename it and every PR waits
  # forever on a check that never reports. Being the only required check, it spares the ruleset from
  # being kept in step with the jobs above, and Renovate's automerge waits for every one of them. A
  # new job only counts once it is added to `needs`. `if: always()` makes it run even when a job it
  # needs fails; a skipped required check would otherwise count as passing.
  ci-passed:
    name: ci
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test, android-build, e2e]
    if: always()
    steps:
      - name: Fail unless every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All checks passed"
