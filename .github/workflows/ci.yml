name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test -- --watch=false --coverage
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  # ── Backend ─────────────────────────────────────────────────────────────────

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  # ── Security ────────────────────────────────────────────────────────────────

  security-check:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - run: mvn verify -P security-check --batch-mode --no-transfer-progress
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  # ── E2E ─────────────────────────────────────────────────────────────────────

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # TODO: add Playwright or Cypress once an E2E framework is set up
    steps:
      - uses: actions/checkout@v4
      - run: echo "No E2E tests yet"