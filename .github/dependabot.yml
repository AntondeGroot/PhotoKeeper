version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Group related packages into one PR. Order is meant to settle it — a package joins the first group
    # it matches — but ordering alone did not hold: two PRs arrived with the Angular packages split
    # between the dev and prod catch-alls, `angular-eslint` among them, so the angular group had
    # claimed nothing. The catch-alls now refuse those names outright, which does not depend on how
    # the ordering is interpreted. Majors are excluded from the catch-alls, so a major bump still gets
    # its own PR to review.
    groups:
      angular:
        # The Angular packages are versioned in lockstep — bumped together or CI breaks on peer-version
        # constraints. @angular/compiler-cli is the sharp one: it peers on @angular/compiler at an
        # *exact* version, and the two sit on opposite sides of the dev/prod line, so a split leaves a
        # lockfile that `npm install` tolerates and `npm ci` — which is what CI runs — refuses. That
        # cost two red PRs before this comment existed.
        patterns:
          - "@angular/*"
          - "@angular*"
          - "@angular-devkit*"
          - "angular-eslint"
          - "ng-packagr"
          - "zone.js"
      dev-minor-patch:
        dependency-type: "development"
        # Kept out by name as well as by order: see the note above the groups.
        exclude-patterns:
          - "@angular/*"
          - "@angular*"
          - "@angular-devkit*"
          - "angular-eslint"
          - "ng-packagr"
          - "zone.js"
        update-types:
          - "minor"
          - "patch"
      prod-minor-patch:
        dependency-type: "production"
        exclude-patterns:
          - "@angular/*"
          - "@angular*"
          - "@angular-devkit*"
          - "angular-eslint"
          - "ng-packagr"
          - "zone.js"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Spring packages move together too; group them, then bundle the remaining minor/patch bumps.
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Roll all action bumps into a single weekly PR.
    groups:
      github-actions:
        patterns:
          - "*"
